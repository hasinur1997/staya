name: deploy

# Deploys to the cPanel server over SSH on every push to main. It can also be
# run by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits instead of cancelling a deploy that
# is already running.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Add required reviewers to this environment in the repository settings if
    # you want a manual approval before each deploy.
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      # The server only receives finished files: production dependencies and
      # the compiled frontend. Nothing is installed or compiled over there.
      - name: Install PHP dependencies (production only)
        run: |
          cp .env.example .env
          composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
          php artisan key:generate --no-interaction

      - name: Build the frontend
        run: |
          npm ci
          npm run build

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # cPanel hosts often have no rsync, so deploy/sync.sh uses only ssh and
      # tar. It compares a checksum manifest with the one from the last deploy
      # and uploads just the files that changed (a fresh build gives every file
      # a new timestamp, so timestamps cannot be used). Files that were never
      # part of a deploy, such as .env and storage/ (uploads, logs, sessions),
      # are never touched.
      - name: Sync files
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: bash deploy/sync.sh

      # The server's .env comes from the ENV_FILE variable of the `production`
      # environment, so changing a setting is a variable edit plus a deploy.
      # If the variable is empty the .env already on the server is kept.
      # Repository variables are readable by anyone with write access to the
      # repository, unlike secrets.
      - name: Write .env
        env:
          ENV_FILE: ${{ vars.ENV_FILE }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          if [ -z "${ENV_FILE}" ]; then
            echo "ENV_FILE is not set; keeping the .env on the server."
            exit 0
          fi
          printf '%s\n' "${ENV_FILE}" | ssh -i ~/.ssh/deploy_key -p "${SSH_PORT}" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "${SSH_USER}@${SSH_HOST}" \
            "umask 077 && cat > '${DEPLOY_PATH}/.env'"

      - name: Migrate and refresh caches
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          PHP_BIN: ${{ vars.PHP_BIN || 'php' }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT}" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "${SSH_USER}@${SSH_HOST}" \
            "cd '${DEPLOY_PATH}' && PHP_BIN='${PHP_BIN}' bash deploy/post-deploy.sh"
